---
name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  # Every merge to main, not only config changes: the merge queue drops
  # Renovate PRs that conflict on go.mod/go.sum with whatever landed first,
  # and waiting for the next cron run leaves them stuck for up to 6 hours.
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry run
        type: boolean
        default: false
      log-level:
        description: Log level
        type: choice
        default: info
        options: [debug, info]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    uses: CowDogMoo/renovate-config/.github/workflows/renovate.yaml@833f09892169458ef84329952e6634b1611de3e4 # main
    with:
      dry-run: ${{ inputs.dry-run || false }}
      log-level: ${{ inputs.log-level || 'info' }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
